services:
  - type: web
    name: wa-auto-cloud
    runtime: node
    plan: free
    buildCommand: npm install --no-fund
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: WA_DB_SECRET
        sync: false
