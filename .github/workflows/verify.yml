name: Verificar WA.Auto Cloud
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-fund
      - name: Verificar codigo e testes
        run: npm run verify
      - name: Instalar navegador e ferramenta apenas para teste visual
        run: |
          npm install --no-save puppeteer@25.12.0
          npx puppeteer browsers install chrome
      - name: Testar interface
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verificada
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Construir container
        run: docker build --pull -t wa-auto:test .
      - name: Conferir healthcheck configurado
        run: docker inspect wa-auto:test --format '{{json .Config.Healthcheck}}' | grep -q '/api/health'

  whatsapp-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-fund
      - name: Exigir QR real via Baileys sem Chromium
        run: npm run test:baileys-live
