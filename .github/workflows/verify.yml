name: Verificar WA.Auto
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run verify
      - run: npx puppeteer browsers install chrome
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-verificada
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
