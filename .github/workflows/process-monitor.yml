name: Monitorar processos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: wa-auto-process-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      WA_AUTO_BASE_URL: ${{ vars.WA_AUTO_BASE_URL || 'https://wa-auto-cloud.onrender.com' }}
    timeout-minutes: 12
    steps:
      - name: Acordar WA.Auto
        shell: bash
        run: |
          set -euo pipefail
          base="${WA_AUTO_BASE_URL%/}"
          for i in $(seq 1 18); do
            code=$(curl --show-error --silent --output /tmp/health-body --write-out "%{http_code}" --connect-timeout 15 --max-time 45 "$base/api/health" || true)
            if [ "$code" = "200" ]; then
              cp /tmp/health-body /tmp/health.json
              cat /tmp/health.json
              exit 0
            fi
            if grep -Eqi "service has been suspended|suspended by its owner" /tmp/health-body 2>/dev/null; then
              echo "::warning::Host WA.Auto suspenso; monitor jurídico será ignorado até WA_AUTO_BASE_URL apontar para um runtime ativo."
              echo "suspended" >/tmp/wa-auto-suspended
              exit 0
            fi
            if [ "$i" -eq 18 ]; then
              echo "WA.Auto não acordou a tempo em $base."
              exit 1
            fi
            sleep 15
          done

      - name: Verificar DataJud e DJEN
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/wa-auto-suspended ]; then
            echo "Monitor ignorado porque o runtime WA.Auto está suspenso."
            exit 0
          fi
          base="${WA_AUTO_BASE_URL%/}"
          ok=0
          for i in $(seq 1 6); do
            if curl --fail --show-error --silent --connect-timeout 20 --max-time 240 "$base/api/legal/cron" | tee /tmp/scan.json; then
              ok=1
              break
            fi
            sleep 20
          done
          [ "$ok" -eq 1 ] || { echo "Varredura jurídica falhou após tentativas."; exit 1; }
          python -c 'import json; d=json.load(open("/tmp/scan.json")); print("checked:",d.get("checked",0)); print("newEvents:",d.get("newEvents",0)); print("sent:",d.get("sent",0)); print("failed:",d.get("failed",0)); print("skipped:",d.get("skipped",False),d.get("reason","")); print("Varredura adiada por proteção de memória; próximo ciclo tentará novamente." if d.get("reason")=="memory-pressure" else "")'
