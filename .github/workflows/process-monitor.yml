name: Monitorar processos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: wa-auto-process-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Acordar WA.Auto
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if curl --fail --show-error --silent --connect-timeout 15 --max-time 45 "https://wa-auto-cloud.onrender.com/api/health" >/tmp/health.json; then
              cat /tmp/health.json
              break
            fi
            if [ "$i" -eq 18 ]; then
              echo "WA.Auto não acordou a tempo."
              exit 1
            fi
            sleep 15
          done

      - name: Verificar DataJud e DJEN
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 6); do
            if curl --fail --show-error --silent --connect-timeout 20 --max-time 240 "https://wa-auto-cloud.onrender.com/api/legal/cron" | tee /tmp/scan.json; then
              ok=1
              break
            fi
            sleep 20
          done
          [ "$ok" -eq 1 ] || { echo "Varredura jurídica falhou após tentativas."; exit 1; }
          python -c 'import json; d=json.load(open("/tmp/scan.json")); print("checked:",d.get("checked",0)); print("newEvents:",d.get("newEvents",0)); print("sent:",d.get("sent",0)); print("failed:",d.get("failed",0)); print("skipped:",d.get("skipped",False),d.get("reason","")); print("Varredura adiada por proteção de memória; próximo ciclo tentará novamente." if d.get("reason")=="memory-pressure" else "")'
