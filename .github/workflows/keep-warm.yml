name: Manter WA.Auto acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: wa-auto-keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Acordar e validar o WA.Auto
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if body=$(curl --fail --show-error --silent --connect-timeout 15 --max-time 45               "https://wa-auto-cloud.onrender.com/api/health"); then
              printf '%s
' "$body" | tee /tmp/health.json
              python - <<'PY'
import json
data=json.load(open('/tmp/health.json'))
assert data.get("ok") is True, data
resources=data.get("resources") or {}
print("uptime:", data.get("uptime"))
print("whatsapp:", data.get("whatsapp"))
print("rssMb:", resources.get("rssMb"))
print("pressure:", resources.get("pressure"))
PY
              exit 0
            fi
            sleep 15
          done
          echo "WA.Auto não respondeu após múltiplas tentativas."
          exit 1
