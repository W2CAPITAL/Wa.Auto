name: Manter WA.Auto acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: wa-auto-keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Acordar e validar o WA.Auto
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            if body=$(curl --fail --show-error --silent --connect-timeout 15 --max-time 45 "https://wa-auto-cloud.onrender.com/api/health"); then
              printf '%s\n' "$body" | tee /tmp/health.json
              python -c 'import json; d=json.load(open("/tmp/health.json")); assert d.get("ok") is True, d; r=d.get("resources") or {}; print("uptime:",d.get("uptime")); print("whatsapp:",d.get("whatsapp")); print("rssMb:",r.get("rssMb")); print("pressure:",r.get("pressure"))'
              exit 0
            fi
            sleep 15
          done
          echo "WA.Auto não respondeu após múltiplas tentativas."
          exit 1
